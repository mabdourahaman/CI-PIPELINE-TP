
name: CI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Recuperation du code du depot
        uses: actions/checkout@v4

      - name: Installation de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dependances
        run: pip install -r requirements.txt

      - name: Installation de Flake8
        run: pip install flake8

      - name: Lint sur app/
        run: flake8 app/ --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Lint sur tests/
        run: flake8 tests/ --count --max-complexity=10 --max-line-length=127 --statistics


  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Recuperation du code du depot
        uses: actions/checkout@v4

      - name: Installation de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dependances
        run: pip install -r requirements.txt

      - name: Execution des tests avec couverture
        run: python -m pytest tests/ -v --cov=app

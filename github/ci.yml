name: CI Workflow
on:

  push:
    branches:
      - main
  
  pull_request:  
    branches:
      - main
  
  workflow_dispatch:

  jobs:

    build:
      runs-on: ubuntu-latest
      steps:
        - name: Recuperation du code du depot
          uses: actions/checkout@v4

        - name: python
          uses: actions/setup-python@v5
          with: 
            python-version: "3.11"

        - name: Installation requirements
          run: pip install -r requirements.txt

        - name: Flake8 sur app
          run: flake8 app --count --select=E9,F63,F7,F82,F841 --show-source --statistics

        - name: Flake8 sur app2 
          run: flake8 app --count --max-complexity=10 --max-line-length=127 --statistics

        - name: Flake8 sur test
          run: flake8 tests --count --max-line-length=127 --statistics

        - name: Execution 
          run: python -m pytest -v --cov=app